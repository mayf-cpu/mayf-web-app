name: MAYF production deployment
on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: 'Exact reviewed main commit SHA to deploy'
        type: string
        required: true
      confirm_production_release:
        description: 'Deploy reviewed candidate to mayf.co.in with checkout disabled'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: mayf-production
  cancel-in-progress: false
jobs:
  deploy_production:
    if: github.ref_name == 'main' && inputs.confirm_production_release == true
    environment: mayf-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The owner approved reusing the existing Firebase project/web app.
      VITE_APP_ENV: production
      VITE_FIREBASE_PROJECT_ID: ${{ vars.MAYF_STAGING_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ vars.MAYF_STAGING_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.MAYF_STAGING_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.MAYF_STAGING_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.MAYF_STAGING_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.MAYF_STAGING_FIREBASE_APP_ID }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.MAYF_STAGING_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require exact reviewed main commit
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
        run: |
          test "$GITHUB_REF_NAME" = "main"
          test "$GITHUB_SHA" = "$EXPECTED_RELEASE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run test:rules
      - name: Verify production provisioning before any deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAYF_STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.MAYF_STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/check-production-deployment.mjs
          node scripts/seed-production-pdf.mjs --verify-only
      - run: npm run build
      - name: Compile reviewed production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAYF_STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.MAYF_STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .worker-production-test
      - name: Record current production rollback target
        id: backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAYF_STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.MAYF_STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/record-production-rollback.mjs
      - name: Deploy reviewed production Worker
        id: release
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAYF_STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.MAYF_STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify production health and authentication perimeter
        id: smoke
        if: steps.release.outcome == 'success'
        continue-on-error: true
        run: node scripts/production-http-smoke.mjs
      - name: Restore recorded production version if release acceptance fails
        if: always() && steps.backup.outcome == 'success' && (steps.release.outcome == 'failure' || steps.smoke.outcome == 'failure')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAYF_STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.MAYF_STAGING_CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_VERSION: ${{ steps.backup.outputs.version }}
        run: npx wrangler rollback "$ROLLBACK_VERSION" --config wrangler.jsonc --yes --message "Automatic rollback after failed production release acceptance"
      - name: Require successful production release acceptance
        if: always() && steps.backup.outcome == 'success'
        env:
          RELEASE_RESULT: ${{ steps.release.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
        run: test "$RELEASE_RESULT" = "success" && test "$SMOKE_RESULT" = "success"
