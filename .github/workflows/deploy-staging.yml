name: MAYF isolated staging deployment

on:
  workflow_dispatch:
    inputs:
      confirm_isolated_staging:
        description: 'Deploy ONLY isolated staging resources (not mayf.co.in)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  deploy_staging:
    if: github.ref_name == 'staging/consolidated-mayf-2026-10-21' && inputs.confirm_isolated_staging == true
    runs-on: ubuntu-latest
    environment: mayf-staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Java 21 for Firestore rules emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Audit production dependencies before staging deploy
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - name: Validate staged Firestore client security rules
        run: npm run test:rules
      - name: Verify isolated staging frontend Firebase configuration
        env:
          MAYF_ALLOW_SHARED_DEVELOPMENT_FIREBASE: 'true'
          VITE_APP_ENV: staging
          MAYF_STAGING_FIREBASE_PROJECT_ID: ${{ vars.MAYF_STAGING_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.MAYF_STAGING_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.MAYF_STAGING_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.MAYF_STAGING_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.MAYF_STAGING_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.MAYF_STAGING_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.MAYF_STAGING_FIREBASE_APP_ID }}
        run: node scripts/check-staging-frontend-env.mjs
      - name: Build frontend with isolated staging Firebase configuration
        env:
          # Public widget key must be compiled into Vite assets; the paired secret stays in the Worker.
          VITE_TURNSTILE_SITE_KEY: ${{ vars.MAYF_STAGING_TURNSTILE_SITE_KEY }}
          MAYF_ALLOW_SHARED_DEVELOPMENT_FIREBASE: 'true'
          VITE_APP_ENV: staging
          MAYF_STAGING_FIREBASE_PROJECT_ID: ${{ vars.MAYF_STAGING_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.MAYF_STAGING_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.MAYF_STAGING_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.MAYF_STAGING_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.MAYF_STAGING_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.MAYF_STAGING_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.MAYF_STAGING_FIREBASE_APP_ID }}
        run: npm run build
      - name: Verify isolated staging config
        run: node scripts/check-staging-isolation.mjs
      - name: Compile isolated staging Worker without deployment
        run: npx wrangler deploy --config wrangler.staging.jsonc --dry-run --outdir .worker-staging-test
      - name: Confirm release candidate branch and explicit staging-only approval
        env:
          STAGING_BRANCH: ${{ github.ref_name }}
          STAGING_CONFIRM: ${{ inputs.confirm_isolated_staging }}
        run: |
          test "$STAGING_BRANCH" = "staging/consolidated-mayf-2026-10-21" || { echo "Wrong staging branch"; exit 1; }
          test "$STAGING_CONFIRM" = "true" || { echo "Explicit isolated staging approval required"; exit 1; }
      - name: Require staging-only deployment credentials
        env:
          STAGING_CLOUDFLARE_TOKEN: ${{ secrets.MAYF_STAGING_CLOUDFLARE_API_TOKEN }}
          STAGING_CLOUDFLARE_ACCOUNT: ${{ secrets.MAYF_STAGING_CLOUDFLARE_ACCOUNT_ID }}
          STAGING_FIREBASE_PROJECT: ${{ vars.MAYF_STAGING_FIREBASE_PROJECT_ID }}
        run: |
          test -n "$STAGING_CLOUDFLARE_TOKEN" || { echo "Missing staging Cloudflare API token"; exit 1; }
          test -n "$STAGING_CLOUDFLARE_ACCOUNT" || { echo "Missing staging Cloudflare account ID"; exit 1; }
          test -n "$STAGING_FIREBASE_PROJECT" || { echo "Missing staging Firebase project ID"; exit 1; }
          # Firebase identity and explicit shared-development consent were validated before the build above.
      - name: Verify Cloudflare staging R2 and service-account binding (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAYF_STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.MAYF_STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-staging-cloudflare-resources.mjs
      - name: Deploy ONLY isolated staging Worker
        run: npx wrangler deploy --config wrangler.staging.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAYF_STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.MAYF_STAGING_CLOUDFLARE_ACCOUNT_ID }}
