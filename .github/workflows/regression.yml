name: MAYF regression checks

on:
  pull_request:
  push:
    branches:
      - fix/backend-runtime-firebase
      - qa/automated-regression-checks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Regression tests
        run: npm test
      - name: Production frontend build
        run: npm run build
      - name: Worker API smoke tests
        run: npm run test:worker
